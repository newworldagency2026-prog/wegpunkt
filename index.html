<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Wegpunkt — Routenplaner</title>
<meta name="description" content="Eigener Multi-Stopp-Routenplaner. Adressen sammeln, Reihenfolge optimieren, navigieren.">
<meta name="theme-color" content="#0F1720">
<meta name="color-scheme" content="light">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wegpunkt">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Kopfzeile -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Wegpunkt</span>
    </div>
    <div class="trip-stats" id="tripStats" hidden>
      <span class="stat"><strong id="statDistance">–</strong><small>km</small></span>
      <span class="stat"><strong id="statDuration">–</strong><small>Min</small></span>
    </div>
  </header>

  <!-- Karte -->
  <main class="map-wrap">
    <div id="map"></div>

    <!-- Adress-Suche über der Karte -->
    <div class="search-box">
      <input id="searchInput" type="text" inputmode="search" autocomplete="off"
             placeholder="Adresse hinzufügen …" aria-label="Adresse suchen">
      <button id="voiceBtn" class="icon-btn" title="Adresse per Sprache eingeben" aria-label="Adresse per Sprache eingeben">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.07A7 7 0 0 1 5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"/></svg>
      </button>
      <button id="addStopBtn" class="icon-btn icon-btn-accent" title="Stopp hinzufügen" aria-label="Stopp hinzufügen">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      </button>
      <button id="locateBtn" class="icon-btn" title="Meinen Standort verwenden" aria-label="Meinen Standort verwenden">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v1.06A8.005 8.005 0 0 1 19.94 11H21a1 1 0 1 1 0 2h-1.06A8.005 8.005 0 0 1 13 19.94V21a1 1 0 1 1-2 0v-1.06A8.005 8.005 0 0 1 4.06 13H3a1 1 0 1 1 0-2h1.06A8.005 8.005 0 0 1 11 4.06V3a1 1 0 0 1 1-1Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5Z"/></svg>
      </button>
    </div>
    <ul id="suggestList" class="suggest-list" hidden></ul>

    <div id="toast" class="toast" hidden></div>

    <button id="navRecenterBtn" class="icon-btn nav-recenter-btn" hidden title="Zur Position zentrieren" aria-label="Zur Position zentrieren">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v1.06A8.005 8.005 0 0 1 19.94 11H21a1 1 0 1 1 0 2h-1.06A8.005 8.005 0 0 1 13 19.94V21a1 1 0 1 1-2 0v-1.06A8.005 8.005 0 0 1 4.06 13H3a1 1 0 1 1 0-2h1.06A8.005 8.005 0 0 1 11 4.06V3a1 1 0 0 1 1-1Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3.5A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5Z"/></svg>
    </button>
  </main>

  <!-- Navigations-Ansicht: Zielstopp, Distanz, in derselben App -->
  <section class="nav-panel" id="navPanel" hidden>
    <div class="nav-target">
      <div class="nav-target-label">Nächster Stopp <span id="navTargetIndex"></span></div>
      <div class="nav-target-address" id="navTargetAddress">–</div>
      <div class="nav-target-distance" id="navTargetDistance">–</div>
    </div>
    <div class="nav-actions">
      <button id="navDoneBtn" class="btn btn-primary">Stopp erledigt</button>
      <button id="navExternalBtn" class="btn btn-ghost" title="In Karten-App öffnen (Sprachnavigation)" aria-label="In Karten-App öffnen">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 11.5L20.5 3 12 20.5l-2.3-6.2z"/></svg>
      </button>
      <button id="navStopBtn" class="btn btn-ghost" title="Navigation beenden" aria-label="Navigation beenden">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg>
      </button>
    </div>
  </section>

  <!-- Bottom Sheet: Stopp-Liste -->
  <section class="sheet" id="sheet">
    <button class="sheet-handle" id="sheetHandle" aria-label="Liste ein-/ausklappen"><span></span></button>

    <div class="sheet-head">
      <h1 id="sheetTitle">Stopps <span class="count-badge" id="stopCount">0</span></h1>
      <div class="sheet-options">
        <label class="toggle">
          <input type="checkbox" id="toggleStart">
          <span>Von meinem Standort starten</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="toggleRoundtrip">
          <span>Zum Start zurückkehren</span>
        </label>
      </div>
    </div>

    <ol id="stopList" class="stop-list"></ol>

    <div class="empty-state" id="emptyState">
      <div class="route-ribbon-empty" aria-hidden="true"></div>
      <p>Noch keine Stopps.<br>Adresse oben eingeben oder auf die Karte tippen.</p>
    </div>

    <div class="sheet-actions">
      <button id="addStopSheetBtn" class="btn btn-ghost" title="Adresse hinzufügen">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        Adresse
      </button>
      <button id="optimizeBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M13 3a1 1 0 0 1 1 1v3.59l4.3-4.3a1 1 0 1 1 1.4 1.42L15.4 9H19a1 1 0 1 1 0 2h-6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1ZM4 12a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-3.59l-4.3 4.3a1 1 0 0 1-1.4-1.42L8.6 13H5a1 1 0 0 1-1-1Z"/></svg>
        Route optimieren
      </button>
      <button id="navigateAllBtn" class="btn btn-ghost" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 11.5L20.5 3 12 20.5l-2.3-6.2z"/></svg>
        Navigation
      </button>
    </div>
  </section>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
